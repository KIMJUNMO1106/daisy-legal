<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>daisy · daisy</title>
<style>:root{--paper:#F3F8FC;--surface:#fff;--ink:#213A4B;--muted:#566D7B;--link:#005A85;--accent:#CDECFB;--warn:#FFEDAD;--line:#D5E3EC}
@media (prefers-color-scheme:dark){:root{--paper:#15232F;--surface:#223544;--ink:#F3F8FC;--muted:#ADB9B1;--link:#73D5FF;--accent:#245F7C;--warn:#5A4A12;--line:#34495A}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Apple SD Gothic Neo","Noto Sans JP","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--link)}
header{background:var(--paper);border-bottom:1px solid var(--line)}
@media (min-width:640px){header{position:sticky;top:0;z-index:1}}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{font-weight:800;font-size:20px;text-decoration:none;color:var(--ink);margin-right:auto;letter-spacing:-.01em}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:4px 10px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px}
nav a[aria-current]{background:var(--accent);font-weight:700}
.langs{font-size:13px;color:var(--muted)}
.langs a{color:var(--muted);margin-left:8px}
.langs a[aria-current]{color:var(--ink);font-weight:700;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
article{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 24px 24px;overflow-wrap:anywhere}
h1{font-size:28px;line-height:1.3;margin:24px 0 8px}
h2{font-size:19px;margin:32px 0 8px;padding-top:8px;scroll-margin-top:80px}
ul{padding-left:1.2em}li{margin:4px 0}
.draft{background:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cards a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink)}
.cards strong{display:block;font-size:18px;margin-bottom:4px}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<main>

</html>
